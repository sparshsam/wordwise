<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wordwisehiccups.vercel.app">
  <meta property="og:title" content="WordWise">
  <meta property="og:description" content="A new word every visit — with definition, pronunciation, and a beautiful background.">
  <meta property="og:image" content="https://wordwisehiccups.vercel.app/og-image.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WordWise">
  <meta name="twitter:description" content="A new word every visit — with definition, pronunciation, and a beautiful background.">
  <meta name="twitter:image" content="https://wordwisehiccups.vercel.app/og-image.png">

  <title>WordWise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      height: 100vh;
      height: 100dvh;
    }

    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    /* ─── TIMEZONE BAR ─── */
    .tz-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 8px;
      pointer-events: none;
      user-select: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .tz-item {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2px 6px;
      min-width: 0;
      flex: 1 0 auto;
      position: relative;
      cursor: default;
    }

    .tz-tooltip {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: rgba(20, 20, 20, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 12px;
      white-space: normal;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.85);
      pointer-events: none;
      opacity: 0;
      text-align: left;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
      line-height: 1.4;
      max-width: 360px;
    }

    .tz-tooltip .tt-label {
      font-weight: 600;
      color: #fff;
      font-size: 0.7rem;
    }

    .tz-tooltip .tt-fact {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }

    .tz-item:hover .tz-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(6px);
    }

    .tz-abbr {
      font-size: 0.55rem;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.1;
    }

    .tz-time {
      font-size: 0.7rem;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .tz-date-desk {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.35);
      margin-left: auto;
      padding: 0 8px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ─── MOBILE CLOCK ─── */
    .mobile-clock {
      display: none;
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }

    .mobile-clock.top-right {
      top: max(0.5rem, env(safe-area-inset-top, 0.5rem));
      right: max(0.75rem, env(safe-area-inset-right, 0.75rem));
      text-align: right;
    }

    .mobile-clock.top-left {
      top: max(0.5rem, env(safe-area-inset-top, 0.5rem));
      left: max(0.75rem, env(safe-area-inset-left, 0.75rem));
      text-align: left;
    }

    .mc-date {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .mc-tz-row {
      display: flex;
      gap: 12px;
      margin-top: 2px;
    }

    .mc-tz {
      display: flex;
      flex-direction: column;
    }

    .mc-abbr {
      font-size: 0.5rem;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.1;
    }

    .mc-time {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    /* ─── WORD AREA ─── */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      background: #111;
    }

    .bg-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
      pointer-events: none;
    }

    #word-box {
      text-align: center;
      max-width: 90vw;
      position: relative;
      z-index: 2;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(3rem, env(safe-area-inset-bottom));
    }

    .word {
      font-size: clamp(3.5rem, 14vw, 10rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.2em;
      color: #fff;
      text-shadow: 0 2px 30px rgba(0,0,0,0.4);
      -webkit-text-size-adjust: none;
      word-break: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
    }

    .phonetic {
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      color: rgba(255,255,255,0.6);
      margin-bottom: 0.5em;
      font-weight: 400;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    .definition {
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      color: rgba(255,255,255,0.8);
      max-width: 500px;
      width: 85vw;
      margin: 0 auto 1.5em;
      line-height: 1.5;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
      overflow-wrap: break-word;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      color: #fff;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }

    .play-btn:active {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
      transform: scale(0.95);
    }

    @media (hover: hover) {
      .play-btn:hover {
        background: rgba(255,255,255,0.2);
        border-color: rgba(255,255,255,0.5);
      }
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .footer {
      position: fixed;
      bottom: max(1.5rem, env(safe-area-inset-bottom, 1rem));
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      z-index: 2;
      pointer-events: none;
      white-space: nowrap;
    }

    .credit {
      position: fixed;
      bottom: max(1.5rem, env(safe-area-inset-bottom, 1rem));
      right: max(1rem, env(safe-area-inset-right, 1rem));
      font-size: 0.6rem;
      color: rgba(255,255,255,0.25);
      z-index: 2;
      text-align: right;
      max-width: 160px;
      pointer-events: none;
    }

    .credit a {
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      pointer-events: auto;
    }

    .loading {
      color: rgba(255,255,255,0.5);
      font-size: clamp(0.9rem, 3vw, 1rem);
    }

    body {
      overscroll-behavior: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-video { transition: none; }
    }

    /* ─── RESPONSIVE ─── */
    @media (min-width: 768px) {
      /* Desktop: show timezone bar, hide mobile clock */
      .tz-bar { display: flex; }
      .mobile-clock { display: none !important; }
      /* Push word-box down a bit to clear the bar */
      #word-box { padding-top: max(2.5rem, env(safe-area-inset-top)); }
    }

    @media (max-width: 767px) {
      /* Mobile: hide desktop bar, show mobile clock */
      .tz-bar { display: none !important; }
      .mobile-clock { display: block; }
    }
  </style>
</head>
<body>
  <!-- Desktop timezone bar -->
  <div class="tz-bar" id="tz-bar"></div>

  <!-- Mobile clock -->
  <div class="mobile-clock top-right" id="mobile-clock"></div>

  <div id="bg-container"></div>
  <div class="overlay"></div>
  <div id="word-box">
    <div class="loading">Loading…</div>
  </div>
  <div class="footer">WordWise</div>
  <div class="credit" id="credit"></div>

  <script>
    // ─── TIMEZONE DATA ───
    var TZ_LIST = [
      { abbr: 'PT',  zone: 'America/Los_Angeles',  label: 'Los Angeles, California, USA',  fact: 'Home to Silicon Valley and Hollywood — two industries that run on California time.' },
      { abbr: 'MT',  zone: 'America/Denver',        label: 'Denver, Colorado, USA',       fact: 'Denver is the only U.S. city to have hosted the Olympics at a mile above sea level.' },
      { abbr: 'CT',  zone: 'America/Chicago',       label: 'Chicago, Illinois, USA',     fact: 'Chicago invented the skyscraper and the brownie — both changed the world.' },
      { abbr: 'ET',  zone: 'America/New_York',      label: 'New York, New York, USA',    fact: 'The New York Stock Exchange opens at 9:30 AM ET — the busiest trading hour on Earth.' },
      { abbr: 'BRT', zone: 'America/Sao_Paulo',     label: 'São Paulo, Brazil',   fact: 'São Paulo is the largest city in the Americas outside North America — 22 million people.' },
      { abbr: 'GMT', zone: 'Europe/London',          label: 'London, England, UK',      fact: 'GMT is the world\'s timekeeping zero — all other timezones are measured against it.' },
      { abbr: 'CET', zone: 'Europe/Berlin',          label: 'Berlin, Germany',      fact: 'Berlin spans two timezone offsets yearly — its DST transition affects most of Europe.' },
      { abbr: 'GST', zone: 'Asia/Dubai',             label: 'Dubai, UAE',       fact: 'Dubai runs on UTC+4 year-round — no daylight saving means sunrise times barely shift.' },
      { abbr: 'PKT', zone: 'Asia/Karachi',           label: 'Karachi, Pakistan',     fact: 'Pakistan is one of the few countries that uses a 30-minute offset (UTC+5:30).' },
      { abbr: 'IST', zone: 'Asia/Kolkata',           label: 'Mumbai, India',      fact: 'India uses a single timezone for 1.4 billion people — sunrise varies by 2 hours east to west.' },
      { abbr: 'CST', zone: 'Asia/Shanghai',          label: 'Beijing, China',     fact: 'China spans five geographic timezones but uses just one — Beijing time across the whole country.' },
      { abbr: 'JST', zone: 'Asia/Tokyo',             label: 'Tokyo, Japan',       fact: 'Japan\'s timezone hasn\'t changed since 1888 — one of the oldest continuous standards.' },
    ];

    // Map IANA zones → abbreviations for opposite lookup
    var TZ_ABBR_MAP = {};
    TZ_LIST.forEach(function(t) { TZ_ABBR_MAP[t.zone] = t.abbr; });

    // Opposite pairs
    var OPPOSITES = {
      'America/New_York':   'Asia/Kolkata',   // IST ~10.5h ahead
      'America/Chicago':    'Asia/Karachi',   // PKT ~11h ahead
      'America/Denver':     'Asia/Dubai',     // GST ~11h ahead
      'America/Los_Angeles':'Asia/Tokyo',     // JST ~17h
      'America/Sao_Paulo':  'Asia/Shanghai',
      'Europe/London':      'Asia/Tokyo',     // ~8h
      'Europe/Berlin':      'Asia/Kolkata',   // ~4.5h
      'Asia/Dubai':         'America/Denver',
      'Asia/Karachi':       'America/Chicago',
      'Asia/Kolkata':       'America/New_York',
      'Asia/Shanghai':      'America/Sao_Paulo',
      'Asia/Tokyo':         'America/Los_Angeles',
    };

    var OPPOSITE_KEYS = Object.keys(OPPOSITES);

    function getUserZone() {
      try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
      catch(e) { return 'America/New_York'; }
    }

    function formatTime(zone) {
      var now = new Date();
      return now.toLocaleTimeString('en-US', {
        timeZone: zone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      });
    }

    function formatDateLong() {
      return new Date().toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    function formatDateShort() {
      return new Date().toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric'
      });
    }

    function getOppositeZone(userZone) {
      // Direct opposite
      if (OPPOSITES[userZone]) return OPPOSITES[userZone];
      // Reverse lookup
      for (var i = 0; i < OPPOSITE_KEYS.length; i++) {
        if (OPPOSITES[OPPOSITE_KEYS[i]] === userZone) return OPPOSITE_KEYS[i];
      }
      // Random pick
      var others = OPPOSITE_KEYS.filter(function(k) { return k !== userZone && OPPOSITES[k] !== userZone; });
      if (others.length === 0) return 'Asia/Kolkata';
      return others[Math.floor(Math.random() * others.length)];
    }

    // Get two opposite zones for mobile
    function getMobileOpposites(userZone) {
      var opp = getOppositeZone(userZone);
      var second = getOppositeZone(opp);
      // Avoid showing same zone or user zone
      if (second === userZone || second === opp) {
        var fallbacks = ['Asia/Kolkata', 'America/New_York', 'Europe/London', 'Asia/Tokyo'];
        for (var i = 0; i < fallbacks.length; i++) {
          if (fallbacks[i] !== userZone && fallbacks[i] !== opp) {
            second = fallbacks[i];
            break;
          }
        }
      }
      return [
        { zone: opp,    abbr: TZ_ABBR_MAP[opp] || opp.split('/').pop() },
        { zone: second, abbr: TZ_ABBR_MAP[second] || second.split('/').pop() },
      ];
    }

    function renderDesktopBar() {
      var bar = document.getElementById('tz-bar');
      var html = '';
      TZ_LIST.forEach(function(t) {
        html += '<div class="tz-item">' +
          '<span class="tz-abbr">' + t.abbr + '</span>' +
          '<span class="tz-time" data-zone="' + t.zone + '">' + formatTime(t.zone) + '</span>' +
          '<div class="tz-tooltip"><span class="tt-label">' + t.label + '</span><br><span class="tt-fact">' + t.fact + '</span></div>' +
          '</div>';
      });
      html += '<div class="tz-date-desk">' + formatDateLong() + '</div>';
      bar.innerHTML = html;

      // Update every 30s
      setInterval(function() {
        var els = bar.querySelectorAll('.tz-time');
        els.forEach(function(el) {
          el.textContent = formatTime(el.getAttribute('data-zone'));
        });
        var dateEl = bar.querySelector('.tz-date-desk');
        if (dateEl) dateEl.textContent = formatDateLong();
      }, 30000);
    }

    function renderMobileClock(userZone) {
      var zones = getMobileOpposites(userZone);
      var html = '<div class="mc-date">' + formatDateShort() + '</div><div class="mc-tz-row">';
      zones.forEach(function(z) {
        html += '<div class="mc-tz">' +
          '<span class="mc-time" data-zone="' + z.zone + '">' + formatTime(z.zone) + '</span>' +
          '<span class="mc-abbr">' + z.abbr + '</span>' +
          '</div>';
      });
      html += '</div>';

      var el = document.getElementById('mobile-clock');
      el.innerHTML = html;

      setInterval(function() {
        var els = el.querySelectorAll('.mc-time');
        els.forEach(function(e) {
          e.textContent = formatTime(e.getAttribute('data-zone'));
        });
        var dateEl = el.querySelector('.mc-date');
        if (dateEl) dateEl.textContent = formatDateShort();
      }, 30000);
    }

    function renderDateCorner() {
      // Date already shown in tz-bar (desktop) and mobile-clock (mobile)
      // Nothing extra needed
    }

    // ─── WORD FETCH ───
    // Show a curated word as instant fallback if API is slow
    var CURATED_FALLBACK = [
      { word: 'serendipity', phonetic: '/ˌsɛrənˈdɪpɪti/', definition: 'the occurrence of events by chance in a happy way' },
      { word: 'ephemeral', phonetic: '/ɪˈfɛm(ə)rəl/', definition: 'lasting for a very short time' },
      { word: 'halcyon', phonetic: '/ˈhælsiən/', definition: 'denoting a period of time that is happy and peaceful' },
      { word: 'petrichor', phonetic: '/ˈpɛtrɪkɔː/', definition: 'the pleasant smell that accompanies rain on dry ground' },
      { word: 'luminous', phonetic: '/ˈluːmɪnəs/', definition: 'full of or shedding light; bright' },
    ];
    var fallbackTimer = setTimeout(function() {
      // If API hasn't responded yet, show a fallback word immediately
      var fb = CURATED_FALLBACK[Math.floor(Math.random() * CURATED_FALLBACK.length)];
      renderWord(fb);
    }, 4000);

    async function fetchWord() {
      try {
        var ctrl = new AbortController();
        var timeout = setTimeout(function() { ctrl.abort(); }, 8000);
        var res = await fetch('/api/word', { signal: ctrl.signal });
        clearTimeout(timeout);
        var data = await res.json();
        clearTimeout(fallbackTimer);
        renderWord(data);
      } catch(e) {
        clearTimeout(fallbackTimer);
        // If nothing rendered yet, show dash
        var box = document.getElementById('word-box');
        if (box && box.querySelector('.loading')) {
          box.innerHTML = '<div class="word" style="font-size:2rem">—</div>';
        }
      }
    }

    function renderWord(data) {
      var container = document.getElementById('bg-container');

      if (data.backgroundType === 'video' && data.background) {
        container.innerHTML = '<video class="bg-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">' +
          '<source src="' + data.background + '" type="video/mp4"></video>';
      } else if (data.background) {
        container.innerHTML = '<div class="bg-image" style="background-image: url(' + data.background + ')" role="img" aria-hidden="true"></div>';
      } else {
        container.innerHTML = '';
      }

      var creditEl = document.getElementById('credit');
      if (data.photographer && data.photoUrl) {
        var mediaType = data.backgroundType === 'video' ? 'Video' : 'Photo';
        creditEl.innerHTML = mediaType + ' by <a href="' + data.photoUrl + '" target="_blank" rel="noopener">' + escapeHtml(data.photographer) + '</a> on <a href="https://pexels.com" target="_blank">Pexels</a>';
      } else {
        creditEl.innerHTML = '';
      }

      var audioHtml = data.audioUrl
        ? '<button class="play-btn" id="play-btn" aria-label="Play pronunciation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg></button>'
        : '';

      var box = document.getElementById('word-box');
      box.innerHTML =
        '<div class="word">' + escapeHtml(data.word) + '</div>' +
        (data.phonetic ? '<div class="phonetic">' + escapeHtml(data.phonetic) + '</div>' : '') +
        '<div class="definition">' + escapeHtml(data.definition) + '</div>' +
        audioHtml;

      if (data.audioUrl) {
        var btn = document.getElementById('play-btn');
        if (btn) {
          btn.addEventListener('click', function() { playAudio(data.audioUrl); });
        }
      }
    }

    function playAudio(url) {
      var audio = new Audio(url);
      audio.play().catch(function() {});
    }

    function escapeHtml(text) {
      if (!text) return '';
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      return d.innerHTML;
    }

    // ─── INIT ───
    var userZone = getUserZone();
    renderDesktopBar();
    renderMobileClock(userZone);
    fetchWord();
  </script>
</body>
</html>
