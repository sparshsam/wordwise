<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordWise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #word-box {
      text-align: center;
      max-width: 90vw;
    }

    .word {
      font-size: clamp(4rem, 15vw, 12rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.25em;
      color: #000;
    }

    .phonetic {
      font-size: 1.1rem;
      color: #999;
      margin-bottom: 0.5em;
      font-weight: 400;
    }

    .definition {
      font-size: 1.2rem;
      color: #666;
      max-width: 500px;
      margin: 0 auto 1.5em;
      line-height: 1.5;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      color: #555;
    }

    .play-btn:hover {
      background: #f5f5f5;
      border-color: #bbb;
    }

    .play-btn svg {
      width: 18px;
      height: 18px;
    }

    .footer {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #ccc;
    }

    .loading {
      color: #bbb;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div id="word-box">
    <div class="loading">Loading…</div>
  </div>
  <div class="footer">WordWise</div>

  <script>
    async function fetchWord() {
      try {
        const res = await fetch('/api/word');
        const data = await res.json();
        renderWord(data);
      } catch {
        document.getElementById('word-box').innerHTML = '<div class="word" style="font-size:2rem">—</div>';
      }
    }

    function renderWord(data) {
      const audioHtml = data.audioUrl
        ? `<button class="play-btn" onclick="playAudio('${data.audioUrl}')" aria-label="Play pronunciation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>
            </svg>
          </button>`
        : '';

      const box = document.getElementById('word-box');
      box.innerHTML = `
        <div class="word">${data.word}</div>
        ${data.phonetic ? `<div class="phonetic">${data.phonetic}</div>` : ''}
        <div class="definition">${data.definition}</div>
        ${audioHtml}
      `;
    }

    function playAudio(url) {
      const audio = new Audio(url);
      audio.play().catch(() => {});
    }

    fetchWord();
  </script>
</body>
</html>
