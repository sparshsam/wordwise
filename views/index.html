<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>WordWise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      overflow: hidden;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 0.8s ease;
    }

    .bg-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background-size: cover;
      background-position: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    #word-box {
      text-align: center;
      max-width: 90vw;
      position: relative;
      z-index: 2;
    }

    .word {
      font-size: clamp(4rem, 15vw, 12rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.25em;
      color: #fff;
      text-shadow: 0 2px 30px rgba(0,0,0,0.4);
    }

    .phonetic {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 0.5em;
      font-weight: 400;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    .definition {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.8);
      max-width: 500px;
      margin: 0 auto 1.5em;
      line-height: 1.5;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      color: #fff;
      backdrop-filter: blur(4px);
    }

    .play-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.5);
    }

    .play-btn svg {
      width: 18px;
      height: 18px;
    }

    .footer {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      z-index: 2;
    }

    .credit {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.25);
      z-index: 2;
      text-align: right;
      max-width: 200px;
    }

    .credit a {
      color: rgba(255,255,255,0.35);
      text-decoration: none;
    }
    .credit a:hover {
      text-decoration: underline;
    }

    .loading {
      color: rgba(255,255,255,0.5);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div id="bg-container"></div>
  <div class="overlay"></div>
  <div id="word-box">
    <div class="loading">Loading…</div>
  </div>
  <div class="footer">WordWise</div>
  <div class="credit" id="credit"></div>

  <script>
    async function fetchWord() {
      try {
        const res = await fetch('/api/word');
        const data = await res.json();
        renderWord(data);
      } catch {
        document.getElementById('word-box').innerHTML = '<div class="word" style="font-size:2rem">—</div>';
      }
    }

    function renderWord(data) {
      const container = document.getElementById('bg-container');

      if (data.backgroundType === 'video' && data.background) {
        container.innerHTML = `
          <video class="bg-video" autoplay muted loop playsinline>
            <source src="${data.background}" type="video/mp4">
          </video>`;
      } else if (data.background) {
        container.innerHTML = `
          <div class="bg-image" style="background-image: url(${data.background})"></div>`;
      } else {
        container.innerHTML = '';
      }

      // Photographer credit
      const creditEl = document.getElementById('credit');
      if (data.photographer && data.photoUrl) {
        creditEl.innerHTML = `Video by <a href="${data.photoUrl}" target="_blank" rel="noopener">${data.photographer}</a> on <a href="https://pexels.com" target="_blank">Pexels</a>`;
      } else {
        creditEl.innerHTML = '';
      }

      // Audio
      const audioHtml = data.audioUrl
        ? `<button class="play-btn" onclick="playAudio('${data.audioUrl}')" aria-label="Play pronunciation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>
            </svg>
          </button>`
        : '';

      const box = document.getElementById('word-box');
      box.innerHTML = `
        <div class="word">${data.word}</div>
        ${data.phonetic ? `<div class="phonetic">${data.phonetic}</div>` : ''}
        <div class="definition">${data.definition}</div>
        ${audioHtml}
      `;
    }

    function playAudio(url) {
      const audio = new Audio(url);
      audio.play().catch(() => {});
    }

    fetchWord();
  </script>
</body>
</html>
