name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check server.js routes/word.js

      - name: Start server and smoke-test API
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          echo "--- API smoke test ---"
          curl -s http://localhost:3000/api/word | python3 -c "
import sys, json
d = json.load(sys.stdin)
assert 'word' in d, 'Missing word'
assert 'definition' in d, 'Missing definition'
assert 'partOfSpeech' in d, 'Missing partOfSpeech'
print(f'OK: {d[\"word\"]} — {d[\"definition\"][:60]}')
"
          echo "--- HTML smoke test ---"
          curl -s http://localhost:3000/ | grep -q 'WordWise' && echo 'OK: HTML contains WordWise'
          kill $SERVER_PID
