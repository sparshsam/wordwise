name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check server.js routes/word.js

      - name: Start server and smoke-test API
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -s http://localhost:3000/api/word | python3 -c "
import sys, json
d = json.load(sys.stdin)
assert 'word' in d
assert 'definition' in d
assert 'partOfSpeech' in d
print(f'OK: {d[\"word\"]}')
"
          curl -s http://localhost:3000/ | grep -q 'WordWise' && echo 'HTML OK'
          kill $SERVER_PID
